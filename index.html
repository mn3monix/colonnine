<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E1A22">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E1A22'/%3E%3Cpath d='M35 8 L18 36 h11 l-4 20 17-28 h-11 z' fill='%23F2A93B'/%3E%3Ccircle cx='32' cy='32' r='27' fill='none' stroke='%231E3543' stroke-width='2'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E1A22'/%3E%3Cpath d='M35 8 L18 36 h11 l-4 20 17-28 h-11 z' fill='%23F2A93B'/%3E%3Ccircle cx='32' cy='32' r='27' fill='none' stroke='%231E3543' stroke-width='2'/%3E%3C/svg%3E">
<title>Tratto residuo — colonnine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#0E1A22; --deep-2:#152632; --deep-3:#1E3543;
  --ice:#DCE8EE; --ice-dim:#7D97A5;
  --signal:#F2A93B; --live:#3ED598; --dead:#5A6B75; --alert:#E4572E;
  --view:#C9A227;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--deep);color:var(--ice);
  font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45;
  padding-top:env(safe-area-inset-top)}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}

#app{display:flex;flex-direction:column;height:100%}
#map{flex:1;min-height:0;background:var(--deep-2)}
#map.hidden{display:none}
#nomap{flex:1;display:none;align-items:center;justify-content:center;text-align:center;padding:32px;color:var(--ice-dim)}
#nomap.show{display:flex}

header{background:var(--deep);border-bottom:1px solid var(--deep-3);flex:none;
  padding:10px max(12px, calc((100% - 900px) / 2)) 11px}
.route-row{display:flex;gap:8px;align-items:center}
.route-row input{flex:1;min-width:0;background:var(--deep-2);border:1px solid var(--deep-3);
  border-radius:10px;padding:11px 13px;outline:none}
.route-row input:focus{border-color:var(--signal)}
.btn{background:var(--deep-3);border-radius:10px;padding:11px 15px;
  font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:16px;
  letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;display:inline-block}
.btn.primary{background:var(--signal);color:#20160A}
.btn.ghost{background:transparent;border:1px solid var(--deep-3)}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.gear{flex:none;background:var(--deep-2);border:1px solid var(--deep-3);border-radius:10px;
  width:44px;height:44px;display:grid;place-items:center;font-size:18px;color:var(--ice-dim)}
.gear:active{border-color:var(--signal)}

/* profili di percorso */
.vias{display:block;margin-top:8px}
.via-row{display:flex;gap:8px;align-items:center;margin-top:6px}
.via-row .n{flex:none;width:20px;text-align:center;font-family:'IBM Plex Mono',monospace;
  font-size:11px;color:var(--signal)}
.via-row input{flex:1;min-width:0;background:var(--deep-2);border:1px solid var(--deep-3);
  border-radius:10px;padding:10px 12px;outline:none;font-size:14px}
.via-row input:focus{border-color:var(--signal)}
.via-row input.empty{border-style:dashed;color:var(--ice-dim)}
.via-row button{flex:none;width:38px;height:38px;border-radius:9px;background:var(--deep-2);
  border:1px solid var(--deep-3);color:var(--ice-dim);font-size:16px;display:grid;place-items:center}
.profiles{display:flex;gap:6px;margin-top:9px}
.pf{flex:1;background:var(--deep-2);border:1px solid var(--deep-3);border-radius:9px;
  padding:8px 4px;font-family:'Barlow Condensed',sans-serif;font-size:13.5px;
  letter-spacing:.07em;text-transform:uppercase;color:var(--ice-dim);text-align:center;line-height:1.15}
.pf.on{background:var(--deep-3);border-color:var(--signal);color:var(--ice)}
.pf small{display:block;font-family:Inter,sans-serif;font-size:9.5px;letter-spacing:.02em;
  text-transform:none;opacity:.65;margin-top:1px}

.soc{display:flex;align-items:center;gap:12px;margin-top:10px}
.soc label{font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ice-dim);flex:none}
.soc input[type=range]{flex:1;-webkit-appearance:none;background:transparent;height:26px}
.soc input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;
  background:linear-gradient(90deg,var(--signal) var(--pct,50%),var(--deep-3) var(--pct,50%))}
.soc input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;
  border-radius:50%;background:var(--ice);margin-top:-10px;border:3px solid var(--deep)}
.soc .val{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:19px;
  min-width:56px;text-align:right;flex:none}

#sheet{flex:none;background:var(--deep-2);border-top:1px solid var(--deep-3);
  max-height:44vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet-head{display:flex;align-items:baseline;justify-content:space-between;
  padding:11px max(14px, calc((100% - 900px) / 2)) 8px;flex:none;gap:12px}
.ver{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.02em;
  color:var(--ice-dim);opacity:.65;text-transform:none;margin-left:7px;font-weight:400}
.sheet-head h2{margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:600;
  font-size:17px;letter-spacing:.1em;text-transform:uppercase;color:var(--ice-dim)}
.sheet-head .sum{font-family:'IBM Plex Mono',monospace;font-size:12.5px;
  color:var(--ice-dim);text-align:right;line-height:1.35}
.sheet-head .sum b{color:var(--ice);font-weight:500}
/* selettore delle rotte alternative */
#routes{display:none;padding:9px max(12px, calc((100% - 900px) / 2)) 2px;flex:none}
#routes.on{display:block}
.routes-row{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:7px}
.rt{flex:none;min-width:132px;background:var(--deep);border:1px solid var(--deep-3);
  border-radius:11px;padding:8px 11px;text-align:left;line-height:1.3}
.rt.on{border-color:var(--signal);background:rgba(242,169,59,.1)}
.rt .lb{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ice-dim);display:block}
.rt.on .lb{color:var(--signal)}
.rt .big{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;display:block;margin-top:1px}
.rt .sm{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ice-dim);display:block}

/* barra delle soste */
#stops{display:none;padding:9px max(12px, calc((100% - 900px) / 2)) 10px;
  border-bottom:1px solid var(--deep-3);flex:none}
#stops.on{display:block}
.stops-row{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.sc{flex:none;background:var(--deep);border:1px solid var(--deep-3);border-radius:20px;
  padding:6px 8px 6px 11px;font-size:12.5px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.sc .n{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ice-dim)}
.sc .x{color:var(--ice-dim);font-size:15px;line-height:1}
.stops-act{display:flex;gap:7px;margin-top:9px}
.stops-act .btn{flex:1;text-align:center;text-decoration:none;padding:10px 8px;font-size:14px}
#list{overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 max(10px, calc((100% - 900px) / 2)) 12px}

.stn{display:grid;grid-template-columns:4px 1fr auto;gap:0 12px;align-items:center;
  background:var(--deep);border:1px solid var(--deep-3);border-radius:var(--radius);
  padding:11px 13px 11px 0;margin-bottom:8px;overflow:hidden;text-align:left;width:100%}
.stn:active{border-color:var(--signal)}
.bar{grid-row:1;align-self:stretch;background:var(--dead);margin:-11px 0}
.stn .mid{min-width:0}
.stn .op{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;
  letter-spacing:.07em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--live);flex:none}
.dot.off{background:var(--alert)}
.hwy{font-size:9px;letter-spacing:.08em;border:1px solid currentColor;border-radius:4px;
  padding:0 3px;opacity:.75;font-family:'IBM Plex Mono',monospace}
.stn .name{color:var(--ice-dim);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stn .right{text-align:right;font-family:'IBM Plex Mono',monospace;flex:none}
.stn .km{font-size:19px;font-weight:600;letter-spacing:-.02em}
.stn .km small{font-size:11px;color:var(--ice-dim);font-weight:400}
.stn .tm{font-size:12.5px;color:var(--ice-dim);margin-top:1px}
.stn .eur{font-size:14px;color:var(--signal);margin-top:1px}
.stn .eur.none{color:var(--ice-dim)}
.stn .cum{font-size:11.5px;color:var(--ice-dim);display:block;margin-top:1px}
.stn .spd{font-size:12px;color:var(--live);display:block;margin-top:1px}
.stn.far{opacity:.42}
.stn .arr{color:var(--live)}
.stn .arr.low{color:var(--alert)}
.reach{display:flex;align-items:center;gap:8px;padding:7px 14px 2px;
  font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ice-dim)}
.reach b{color:var(--live);font-weight:500}
.reach b.low{color:var(--alert)}
.plan{display:flex;align-items:center;gap:10px;margin:6px 4px 10px;padding:10px 13px;
  background:var(--deep);border:1px solid var(--deep-3);border-radius:var(--radius)}
.plan .txt{flex:1;font-size:13px;line-height:1.4}
.plan .txt b{font-family:'IBM Plex Mono',monospace;font-weight:500}
.plan .txt.bad{color:var(--alert)}
.plan button{flex:none;background:var(--signal);color:#20160A;border-radius:9px;padding:9px 13px;
  font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px;letter-spacing:.05em;text-transform:uppercase}
.stn.step{border-color:var(--signal)}
.stn .charge{font-size:12.5px;color:var(--signal);margin-top:1px}
.stepno{background:var(--signal);color:#20160A;border-radius:5px;padding:0 5px;
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600}
/* riga punto di interesse */
.stn.poi .op{color:var(--view)}
.stn.poi .rate{font-size:14px;color:var(--view);margin-top:1px}

#detail{position:fixed;inset:0;background:rgba(5,12,17,.72);backdrop-filter:blur(6px);
  display:none;align-items:flex-end;z-index:40}
#detail.show{display:flex}
.card{background:var(--deep-2);width:100%;border-radius:20px 20px 0 0;border-top:1px solid var(--deep-3);
  padding:20px max(18px, calc((100% - 620px) / 2)) calc(20px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto}
.card h3{margin:0;font-family:'Barlow Condensed',sans-serif;font-size:26px;letter-spacing:.02em}
.card .sub{color:var(--ice-dim);font-size:13.5px;margin:2px 0 18px}
.readout{border:1px solid var(--deep-3);border-radius:var(--radius);padding:16px 18px;
  background:linear-gradient(180deg,var(--deep) 0%,#0B151C 100%)}
.readout .lbl{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ice-dim)}
.readout .big{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:46px;
  color:var(--signal);line-height:1.05;letter-spacing:-.03em;margin-top:2px}
.readout .big.na{font-size:22px;color:var(--ice-dim);line-height:1.3;margin-top:6px}
.readout .big.view{color:var(--view)}
.readout .calc{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ice-dim);margin-top:8px}
.declared{margin-top:10px;padding-top:10px;border-top:1px dashed var(--deep-3);
  font-size:12.5px;color:var(--ice-dim)}
.declared b{color:var(--ice);font-family:'IBM Plex Mono',monospace;font-weight:500}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--deep-3);
  border:1px solid var(--deep-3);border-radius:var(--radius);overflow:hidden;margin-top:12px}
.spec{background:var(--deep-2);padding:11px 13px}
.spec .k{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ice-dim)}
.spec .v{font-family:'IBM Plex Mono',monospace;font-size:16px;margin-top:1px}
.shot{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:var(--radius);
  margin-bottom:14px;background:var(--deep-3);display:block}
.shot.hide{display:none}
.desc{margin-top:12px;padding:13px 15px;border:1px solid var(--deep-3);border-radius:var(--radius);
  background:var(--deep);font-size:14px;line-height:1.55}
.desc.load{color:var(--ice-dim);font-style:italic}
.desc .src{display:block;margin-top:7px;font-size:11.5px;color:var(--ice-dim);font-style:normal}
.card .actions{display:flex;gap:8px;margin-top:14px}
.card .actions .btn{flex:1;text-align:center;text-decoration:none}

#settings{position:fixed;inset:0;background:var(--deep);z-index:50;display:none;overflow-y:auto;
  padding-top:calc(18px + env(safe-area-inset-top));
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
  padding-inline:max(16px, calc((100% - 560px) / 2))}
#settings.show{display:block}
#settings h2{font-family:'Barlow Condensed',sans-serif;font-size:24px;letter-spacing:.04em;margin:0 0 4px}
#settings h4{font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ice-dim);margin:22px 0 8px;
  border-bottom:1px solid var(--deep-3);padding-bottom:6px}
.field{margin-bottom:9px}
.field label{display:block;font-size:12.5px;color:var(--ice-dim);margin-bottom:4px}
.field input,.field select{width:100%;background:var(--deep-2);border:1px solid var(--deep-3);
  border-radius:10px;padding:10px 12px;outline:none}
.field input:focus,.field select:focus{border-color:var(--signal)}
.hint{font-size:12.5px;color:var(--ice-dim);line-height:1.55}
/* interruttori */
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:9px 0;border-bottom:1px solid var(--deep-3)}
.sw:last-of-type{border-bottom:none}
.sw .t{font-size:14.5px}
.sw .t small{display:block;font-size:12px;color:var(--ice-dim);margin-top:1px}
.sw input{appearance:none;width:46px;height:27px;border-radius:14px;background:var(--deep-3);
  position:relative;flex:none;cursor:pointer;transition:background .18s;border:none;padding:0}
.sw input:checked{background:var(--signal)}
.sw input::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;
  border-radius:50%;background:var(--ice);transition:transform .18s}
.sw input:checked::after{transform:translateX(19px);background:#20160A}

.op-row{display:grid;grid-template-columns:28px 24px 1fr 66px 54px 26px;gap:6px;align-items:center;margin-bottom:7px}
.op-row input[type=color]{width:28px;height:28px;padding:0;border:1px solid rgba(255,255,255,.18);
  border-radius:7px;background:transparent;cursor:pointer}
.op-row input[type=checkbox]{appearance:none;width:22px;height:22px;border-radius:6px;
  border:1px solid var(--deep-3);background:var(--deep-2);cursor:pointer;position:relative;margin:0}
.op-row input[type=checkbox]:checked{background:var(--signal);border-color:var(--signal)}
.op-row input[type=checkbox]:checked::after{content:'✓';position:absolute;inset:0;
  display:grid;place-items:center;color:#20160A;font-size:14px;font-weight:700}
.op-row .nm{font-family:'Barlow Condensed',sans-serif;font-size:15px;letter-spacing:.05em;
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op-row .nm.off{opacity:.4;text-decoration:line-through}
.op-row input[type=number]{background:var(--deep-2);border:1px solid var(--deep-3);border-radius:8px;
  padding:7px 6px;width:100%;font-family:'IBM Plex Mono',monospace;font-size:13.5px;outline:none}
.op-row input[type=number]:focus{border-color:var(--signal)}
.op-row .del{color:var(--ice-dim);font-size:19px;line-height:1;text-align:center}
.op-head{display:grid;grid-template-columns:28px 24px 1fr 66px 54px 26px;gap:6px;
  font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ice-dim);margin-bottom:5px}
.op-head span:nth-child(4),.op-head span:nth-child(5){text-align:center}

.found{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.chip{background:var(--deep-2);border:1px solid var(--deep-3);border-radius:20px;
  padding:7px 13px;font-size:13px;display:flex;align-items:center;gap:7px}
.chip b{font-weight:500}
.chip .n{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ice-dim)}
.chip .plus{color:var(--signal);font-size:17px;line-height:1}
.chip.on{border-color:var(--view);background:rgba(201,162,39,.14);color:var(--ice)}
.chip.on .plus{color:var(--view)}
.add-row{display:flex;gap:8px;margin-top:9px}
.add-row input{flex:1;background:var(--deep-2);border:1px solid var(--deep-3);
  border-radius:10px;padding:10px 12px;outline:none;min-width:0}
.add-row input:focus{border-color:var(--signal)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--deep-3);
  border:1px solid var(--ice-dim);border-radius:10px;padding:9px 15px;font-size:13.5px;
  z-index:60;opacity:0;pointer-events:none;transition:opacity .25s;max-width:86vw;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="route-row">
      <input id="dest" type="text" data-tp="destPh" autocomplete="off">
      <button class="btn primary" id="go" data-t="trace">Traccia</button>
      <button class="gear" id="gear" aria-label="Impostazioni">⚙</button>
    </div>
    <div class="vias" id="vias"></div>
    <div class="profiles" id="profiles">
      <button class="pf on" data-pf="fast"><span data-t="pfFast">Veloce</span><small data-t="pfFastS">il più rapido</small></button>
      <button class="pf" data-pf="scenic"><span data-t="pfSce">Panoramico</span><small data-t="pfSceS">cosa vedere</small></button>
      <button class="pf" data-pf="cheap"><span data-t="pfChe">Economico</span><small data-t="pfCheS">evita pedaggi</small></button>
    </div>
    <div class="soc">
      <label for="soc" data-t="socLab">Carica ora</label>
      <input id="soc" type="range" min="1" max="79" value="42">
      <span class="val" id="socVal">42%</span>
    </div>
  </header>

  <div id="map"></div>
  <div id="nomap"><div>
    <p style="font-family:'Barlow Condensed',sans-serif;font-size:20px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px" data-t="mapOff">Mappa non attiva</p>
    <p class="hint" style="max-width:280px" data-t="mapOffTx"></p>
  </div></div>

  <div id="sheet">
    <div class="sheet-head">
      <h2><span data-t="sheet">Sul tratto residuo</span><span class="ver" id="ver"></span></h2>
      <span class="sum" id="count">—</span>
    </div>
    <div id="routes"><div class="routes-row" id="routesRow"></div></div>
    <div id="stops">
      <div class="stops-row" id="stopsRow"></div>
      <div class="stops-act">
        <a class="btn primary" id="navGo" href="#" data-t="navStops">Naviga con le soste</a>
        <button class="btn ghost" id="stopsClear" data-t="clear">Svuota</button>
      </div>
    </div>
    <div id="list"></div>
  </div>
</div>

<div id="detail" role="dialog" aria-modal="true"><div class="card" id="detailCard"></div></div>

<div id="settings">
  <h2 data-t="setT">Impostazioni</h2>
  <p class="hint"><span data-t="setSub"></span> <span id="verSet"></span></p>

  <h4 data-t="hLang">Lingua</h4>
  <div class="field"><select id="lang"></select></div>

  <h4 data-t="hRoute">Percorso</h4>

/* ============================================================
   Geometria e formati
   ============================================================ */
const R=6371;
function hav(a,b){
  const dLat=(b.lat-a.lat)*Math.PI/180,dLon=(b.lng-a.lng)*Math.PI/180;
  const la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180;
  const h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function segDist(p,a,b){
  const k=Math.cos(a.lat*Math.PI/180);
  const px=(p.lng-a.lng)*k,py=p.lat-a.lat;
  const bx=(b.lng-a.lng)*k,by=b.lat-a.lat;
  const L=bx*bx+by*by;
  let t=L>0?(px*bx+py*by)/L:0; t=Math.max(0,Math.min(1,t));
  const dx=px-t*bx,dy=py-t*by;
  return {d:Math.sqrt(dx*dx+dy*dy)*111.32,t};
}
function fmtDur(sec){
  if(!isFinite(sec)||sec<0) return '—';
  const m=Math.round(sec/60);
  return m<60 ? m+' '+t('min') : Math.floor(m/60)+t('hr')+' '+String(m%60).padStart(2,'0');
}
function fmtClock(d){ return d.toLocaleTimeString(loc(),{hour:'2-digit',minute:'2-digit'}); }

function norm(s){ return (s||'').toLowerCase().replace(/[^a-z0-9à-ÿ ]/g,' '); }

function myIndex(){ let b=0,bd=Infinity;
  for(let i=0;i<route.length;i++){const d=hav(me,route[i]); if(d<bd){bd=d;b=i;}} return b; }
function timeAt(km){
  if(!cumT.length) return NaN;
  if(km<=0) return 0;
  const tot=cum[cum.length-1];
  if(km>=tot) return cumT[cumT.length-1];
  let lo=0,hi=cum.length-1;
  while(hi-lo>1){ const mid=(lo+hi)>>1; if(cum[mid]<=km) lo=mid; else hi=mid; }
  const span=cum[hi]-cum[lo], f=span>0?(km-cum[lo])/span:0;
  return cumT[lo]+f*(cumT[hi]-cumT[lo]);
}

/* riconosce se un passo del percorso è autostradale, dal testo dell'indicazione */
const HWY_RE=/autostrad|autobahn|motorway|d[áa]lnic|autoput|\bBAB\b|\bA\s?\d{1,3}\b|\bE\s?\d{1,3}\b|\bD\s?\d{1,2}\b|\bS\s?\d{1,2}\b/i;

/* ============================================================
   Filtri
   ============================================================ */
function nearestOnRoute(s,i0){
  let bd=Infinity,at=0,idx=i0;
  for(let i=Math.max(0,i0-1);i<route.length-1;i++){
    const r=segDist(s,route[i],route[i+1]);
    if(r.d<bd){ bd=r.d; at=cum[i]+r.t*(cum[i+1]-cum[i]); idx=i; }
  }
  return {off:bd,at,idx};
}
function aheadOf(arr,extra){
  if(!route.length) return arr.map(s=>({...s,km:hav(me,s)})).sort((a,b)=>a.km-b.km);
  const i0=myIndex(),base=cum[i0],baseT=timeAt(base),out=[];
  const lim = extra&&extra.radius ? extra.radius : S.corridor;
  for(const s of arr){
    if(!extra?.poi){
      const o=opFor(s.operator);
      if(o && o.use===false) continue;              // operatore disattivato
      if(!o && S.onlyMine) continue;                // tengo solo i miei
    }
    const r=nearestOnRoute(s,i0);
    if(r.off>lim || r.at<base-1) continue;
    const onHwy=!!hwy[r.idx];
    if(!extra?.poi && S.cmode==='highway' && !(onHwy && r.off<=2)) continue;
    out.push({...s,km:r.at-base,off:r.off,sec:timeAt(r.at)-baseT,onHwy});
  }
  return out.sort((a,b)=>a.km-b.km);
}
const filterAhead=()=>aheadOf(stations);
const poisAhead =()=>aheadOf(pois,{poi:true,radius:15});

/* ============================================================
   Piano delle soste — catena greedy "la più lontana raggiungibile"
   ============================================================ */
// Wh/km alla velocità v, da aerodinamica e rotolamento, calibrato sul consumo dichiarato
function whAt(v){
  const CdA=0.62, massa=2100, Crr=0.010, aux=450, eta=0.88, rho=1.225;
  const f=vk=>{ const ms=vk/3.6;
    const F=0.5*rho*CdA*ms*ms + Crr*massa*9.81;
    return (F/3.6)/eta + aux/vk; };
  const rif=S.refv||110;
  return f(v)*(S.wh/f(rif));
}
// velocità massima per coprire km arrivando con socEnd partendo da socStart
function speedFor(km,socStart,socEnd){
  if(!(km>1)) return null;
  const disponibili=Math.max(0,(socStart-socEnd)/100*S.kwh*1000)/km;   // Wh/km
  if(disponibili<=0) return 0;
  if(whAt(135)<=disponibili) return null;        // nessun vincolo: vai come vuoi
  let lo=45,hi=135;
  for(let i=0;i<40;i++){ const mid=(lo+hi)/2; if(whAt(mid)<=disponibili) lo=mid; else hi=mid; }
  return lo;
}
function kmFromSoc(pct){ return Math.max(0,pct/100*S.kwh*1000/S.wh); }
function socForKm(km){ return km*S.wh/1000/S.kwh*100; }

function buildPlan(rows){
  const soc0=+document.getElementById('soc').value;
  const dest=summary?summary.km:(rows.length?rows[rows.length-1].km:0);

  function chain(){
    const plan=[]; let pos=0, soc=soc0, fail=false;
    for(let guard=0; guard<25; guard++){
      if(kmFromSoc(soc-S.reserve)>=dest-pos) break;              // ci arrivi
      const norm=kmFromSoc(Math.min(soc,80)-S.reserve);          // con ricarica all'80%
      const max =kmFromSoc(soc-S.reserve);                       // spremendo fino al 100%
      let cand=rows.filter(s=>s.km>pos+1 && s.km-pos<=norm);
      if(!cand.length) cand=rows.filter(s=>s.km>pos+1 && s.km-pos<=max);
      if(!cand.length){ fail=true; break; }
      const maxKm=Math.max(...cand.map(c=>c.km));
      const near=cand.filter(c=>c.km>=maxKm-40).sort((a,b)=>{
        const oa=opFor(a.operator)?1:0, ob=opFor(b.operator)?1:0;
        if(oa!==ob) return ob-oa;
        if(Math.abs((a.kw||0)-(b.kw||0))>40) return (b.kw||0)-(a.kw||0);
        return b.km-a.km;
      });
      const s=near[0];
      plan.push({s, arr: soc-socForKm(s.km-pos)});
      pos=s.km; soc=100;                                         // massimo teorico
    }
    return {plan,fail};
  }

  function targets(plan){
    let pos=0, soc=soc0;
    for(let i=0;i<plan.length;i++){
      plan[i].arr=soc-socForKm(plan[i].s.km-pos);
      const nextKm=(i+1<plan.length)?plan[i+1].s.km:dest;
      const need=S.reserve+socForKm(nextKm-plan[i].s.km);     // carica desiderata all'arrivo
      plan[i].target=Math.max(plan[i].arr, Math.min(100, need));
      plan[i].kwh=Math.max(0,(plan[i].target-plan[i].arr)/100*S.kwh)/S.eff;
      const o=opFor(plan[i].s.operator);
      plan[i].eur=o?plan[i].kwh*o.price+(o.fee||0):null;
      plan[i].min=plan[i].kwh/Math.min(S.avgkw,plan[i].s.kw||S.avgkw)*60;
      plan[i].cum=(i>0?(plan[i-1].cum||0):0)+(plan[i].eur||0);
      plan[i].vmax=speedFor(plan[i].s.km-pos, soc, S.reserve);
      pos=plan[i].s.km; soc=plan[i].target;
    }
    if(plan.length){
      const u=plan[plan.length-1];
      plan.vFinal=speedFor(dest-u.s.km, u.target, S.reserve);
    }
    return plan;
  }

  let {plan,fail}=chain();
  targets(plan);
  // tolgo le soste dove non serve caricare nulla, poi ricalcolo
  for(let round=0; round<3; round++){
    const puliti=plan.filter(p=>p.kwh>=5);            // sotto i ~3 minuti non è una sosta
    if(puliti.length===plan.length) break;
    plan=puliti; targets(plan);
  }
  return {plan,fail,dest};
}
let PLAN={plan:[],fail:false,dest:0};
function planFor(s){ return PLAN.plan.find(p=>p.s.lat===s.lat&&p.s.lng===s.lng)||null; }
// carica all'arrivo tenendo conto delle soste già pianificate prima
function socChain(km){
  const soc0=+document.getElementById('soc').value;
  let pos=0, soc=soc0;
  for(const p of PLAN.plan){
    if(p.s.km>=km) break;
    soc=p.target; pos=p.s.km;
  }
  return soc-socForKm(km-pos);
}

// costo di una sessione standard 10→80%, per confrontare gli operatori fra loro
function costFull(s){
  const o=opFor(s.operator); if(!o) return null;
  const kwh=0.70*S.kwh/S.eff;
  return {kwh, eur:kwh*o.price+(o.fee||0)};
}
function costTo80(s){
  const arr=socChain(s.km);                   // tiene conto delle soste precedenti
  const kwh=Math.max(0,(80-arr)/100*S.kwh)/S.eff;
  const o=opFor(s.operator);
  return o?{kwh,eur:kwh*o.price+(o.fee||0),op:o,arr}:{kwh,eur:null,op:null,arr};
}

async function fetchOCM(){
  if(!route.length){ stations=DEMO.slice(); return; }
  const probes=[]; let last=-999;
  for(let i=0;i<route.length;i++) if(cum[i]-last>60){ probes.push(route[i]); last=cum[i]; }
  const seen=new Set(),got=[];
  for(const p of probes.slice(0,26)){
    const u=new URL('https://api.openchargemap.io/v3/poi/');
    u.searchParams.set('output','json');
    u.searchParams.set('latitude',p.lat); u.searchParams.set('longitude',p.lng);
    u.searchParams.set('distance',35); u.searchParams.set('distanceunit','KM');
    u.searchParams.set('maxresults',60); u.searchParams.set('compact','true');
    u.searchParams.set('minpowerkw',S.minkw||50);
    if(S.ockey) u.searchParams.set('key',S.ockey);
    try{
      const r=await fetch(u); if(!r.ok) continue;
      for(const poi of await r.json()){
        if(seen.has(poi.ID)) continue; seen.add(poi.ID);
        const c=poi.Connections||[];
        got.push({
          name:poi.AddressInfo?.Title||'Colonnina',
          town:poi.AddressInfo?.Town||'',
          operator:poi.OperatorInfo?.Title||'—',
          lat:poi.AddressInfo?.Latitude, lng:poi.AddressInfo?.Longitude,
          kw:Math.max(0,...c.map(x=>x.PowerKW||0)),
          pts:poi.NumberOfPoints||c.reduce((a,x)=>a+(x.Quantity||1),0),
          live:poi.StatusType?poi.StatusType.IsOperational!==false:true,
          declared:(poi.UsageCost||'').trim()
        });
      }
    }catch(e){}
  }
  usingDemo=!got.length;
  stations=got.length?got:DEMO.slice();
  if(usingDemo) toast(S.ockey?t('tDemoNo'):t('tDemoKey'));
}

/* ============================================================
   Cose da vedere (solo profilo panoramico)
   ============================================================ */
function nearbyPromise(loc,cat){
  return new Promise(res=>{
    if(!placesSvc) return res([]);
    const req={location:loc,radius:15000};
    if(cat.type) req.type=cat.type;
    if(cat.kw) req.keyword=cat.kw;
    placesSvc.nearbySearch(req,(r,st)=>
      res(st===google.maps.places.PlacesServiceStatus.OK&&r?r.map(x=>({x,cat})):[])
    );
  });
}
function excluded(name){
  const words=(S.exclude||'').split(',').map(w=>w.trim().toLowerCase()).filter(Boolean);
  const n=(name||'').toLowerCase();
  return words.some(w=>n.includes(w));
}
async function fetchPOIs(pathArr,cumArr,light){
  const cats=CATS.filter(c=>S.cats.includes(c.id));
  if(!cats.length) return [];
  const used=light?cats.slice(0,2):cats;
  const spacing=light?110:70, cap=light?7:16;
  const probes=[]; let last=-999;
  for(let i=0;i<pathArr.length;i++) if(cumArr[i]-last>spacing){ probes.push(pathArr[i]); last=cumArr[i]; }
  const jobs=[];
  for(const p of probes.slice(0,cap))
    for(const c of used) jobs.push(nearbyPromise(new google.maps.LatLng(p.lat,p.lng),c));
  const res=await Promise.all(jobs);
  const seen=new Set(),out=[];
  for(const list of res) for(const {x:p,cat} of list){
    if(!p.place_id||seen.has(p.place_id)) continue;
    const rating=p.rating||0, rev=p.user_ratings_total||0;
    if(rating<S.minrate||rev<S.minrev) continue;
    if(excluded(p.name)) continue;
    seen.add(p.place_id);
    let photo='';
    try{ photo=p.photos&&p.photos[0]?p.photos[0].getUrl({maxWidth:900,maxHeight:560}):''; }catch(e){}
    out.push({ poi:true, name:p.name, place_id:p.place_id,
               lat:p.geometry.location.lat(), lng:p.geometry.location.lng(),
               rating, rev, cat:t('cat_'+cat.id), catId:cat.id, photo,
               vicinity:p.vicinity||'' });
  }
  return out;
}

const MAX_STOPS=9;   // limite degli URL di Google Maps
function isStop(s){ return S.stops.some(x=>Math.abs(x.lat-s.lat)<1e-6&&Math.abs(x.lng-s.lng)<1e-6); }
async function toggleStop(s){
  const i=S.stops.findIndex(x=>Math.abs(x.lat-s.lat)<1e-6&&Math.abs(x.lng-s.lng)<1e-6);
  if(i>=0) S.stops.splice(i,1);
  else{
    if(S.stops.length>=MAX_STOPS) return toast(t('tMaxStops'));
    S.stops.push({name:s.name,lat:s.lat,lng:s.lng,
                  operator:s.poi?'★ '+s.rating.toFixed(1):(s.operator||''),km:s.km});
  }
  S.stops.sort((a,b)=>(a.km??0)-(b.km??0));
  await save(); renderStops(); render();
}
function navUrl(){
  if(!S.stops.length) return '#';
  const dest=S.lastDest ? encodeURIComponent(S.lastDest)
                        : `${S.stops[S.stops.length-1].lat},${S.stops[S.stops.length-1].lng}`;
  const pts=[...S.via.filter(v=>v.lat!=null).map(v=>({lat:v.lat,lng:v.lng,km:-1})),
             ...(S.lastDest?S.stops:S.stops.slice(0,-1))];
  const way=pts.map(s=>`${s.lat.toFixed(6)},${s.lng.toFixed(6)}`).join('|');
  return 'https://www.google.com/maps/dir/?api=1'+
         `&origin=${me.lat.toFixed(6)},${me.lng.toFixed(6)}`+
         `&destination=${dest}`+(way?`&waypoints=${encodeURIComponent(way)}`:'')+
         '&travelmode=driving';
}

const detCache=new Map();
function placeDetails(id){
  if(detCache.has(id)) return Promise.resolve(detCache.get(id));
  return new Promise(res=>{
    if(!placesSvc||!id){ res(null); return; }
    placesSvc.getDetails(
      {placeId:id,fields:['editorial_summary','website','formatted_address','opening_hours','photos']},
      (d,st)=>{
        const ok=st===google.maps.places.PlacesServiceStatus.OK?d:null;
        detCache.set(id,ok); res(ok);
      });
  });
}

  box.classList.remove('load');

        <div class="spec"><div class="k">${t('dSt')}</div><div class="v" style="color:${s.live?'var(--live)':'var(--alert)'}">${s.live?t('dOn'):t('dOff')}</div></div>
        <div class="spec"><div class="k">${t('dArr')}</div><div class="v" style="color:${c.arr<S.reserve?'var(--alert)':'var(--live)'}">${c.arr>0?Math.round(c.arr)+'%':t('dry')}</div></div>
        <div class="spec"><div class="k">${t('dEn')}</div><div class="v">${c.kwh.toFixed(1)} kWh</div></div>
        ${st&&st.vmax!==undefined?`<div class="spec"><div class="k">${t('dSpeed')}</div><div class="v" style="color:var(--live)">${st.vmax?Math.round(st.vmax)+' km/h':t('freeSp')}</div></div>`:''}
        ${st?`<div class="spec"><div class="k">${t('thisCh')}</div><div class="v" style="color:var(--signal)">${st.eur!=null?'€ '+st.eur.toFixed(2):'—'}</div></div>
        <div class="spec"><div class="k">${t('runTot')}</div><div class="v">${st.cum!=null?'€ '+st.cum.toFixed(2):'—'}</div></div>`:''}
        ${(()=>{const f=costFull(s); return f?`<div class="spec"><div class="k">${t('fullCh')}</div><div class="v">€ ${f.eur.toFixed(2)}</div></div>
        <div class="spec"><div class="k">kWh 10→80%</div><div class="v">${f.kwh.toFixed(1)}</div></div>`:'';})()}
      </div>
      <div class="actions">
        <button class="btn ${isStop(s)?'primary':''}" id="stopBtn">${isStop(s)?t('stopOn'):t('stopAdd')}</button>
        ${!o?`<button class="btn" id="quickAdd">${t('opAdd')}</button>`:
             `<a class="btn" href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}&travelmode=driving">${t('navigate')}</a>`}
        <button class="btn" id="closeD">${t('close')}</button>
      </div>`;
  }
  document.getElementById('detail').classList.add('show');
  if(s.poi) fillDescription(s);
  document.getElementById('closeD').onclick=()=>document.getElementById('detail').classList.remove('show');
  const sb=document.getElementById('stopBtn');
  if(sb) sb.onclick=async()=>{ await toggleStop(s); openDetail(s); };
  const qa=document.getElementById('quickAdd');
  if(qa) qa.onclick=async()=>{
    addOperator(s.operator); await save();
    document.getElementById('detail').classList.remove('show');
    render(); toast(s.operator+' '+t('tOpAdded'));
  };
}
document.getElementById('detail').onclick=e=>{ if(e.target.id==='detail') e.target.classList.remove('show'); };

function addOperator(raw){
  const cat=catalogFor(raw), nm=cat?cat.nm:(raw||'').trim();
  if(!nm) return false;
  if(S.ops.some(o=>o.nm.toLowerCase()===nm.toLowerCase())) return false;
  S.ops.push({nm,color:cat?cat.color:nextColor(),
              match:cat?cat.match.slice():[nm.toLowerCase()],price:0.50,fee:0,use:true});
  return true;
}

function drawMarkers(rows,views){
  if(!map) return;
  markers.forEach(m=>m.setMap(null)); markers=[];
  rows.forEach(s=>{
    const o=opFor(s.operator);
    const st=planFor(s);
    markers.push(new google.maps.Marker({
      position:{lat:s.lat,lng:s.lng},map,clickable:false,zIndex:o?18:4,
      icon:{path:google.maps.SymbolPath.CIRCLE,scale:o?13:8.5,
            fillColor:'#08121A',fillOpacity:.92,strokeWeight:0}
    }));
    const mk=new google.maps.Marker({
      position:{lat:s.lat,lng:s.lng},map,title:`${s.operator} — ${s.name}`,zIndex:o?20:5,
      icon:{path:google.maps.SymbolPath.CIRCLE,scale:o?8:4.5,
            fillColor:o?o.color:'#8FA3AE',fillOpacity:1,
            strokeColor:!s.live?'#E4572E':(st?'#FFFFFF':'#08121A'),
            strokeWeight:!s.live?2.5:(st?2.5:1.5)}
    });
    mk.addListener('click',()=>openDetail(s));
    markers.push(mk);

  (views||[]).forEach(p=>{
    markers.push(new google.maps.Marker({
      position:{lat:p.lat,lng:p.lng},map,clickable:false,zIndex:28,
      icon:{path:google.maps.SymbolPath.CIRCLE,scale:15,fillColor:'#08121A',fillOpacity:.92,strokeWeight:0}
    }));
    const mk=new google.maps.Marker({
      position:{lat:p.lat,lng:p.lng},map,title:`${p.name} — ★ ${p.rating}`,zIndex:30,
      label:{text:p.rating.toFixed(1),color:'#20160A',fontSize:'10px',fontWeight:'700'},
      icon:{path:'M 0,-12 L 12,0 L 0,12 L -12,0 Z',fillColor:'#C9A227',fillOpacity:1,
            strokeColor:'#20160A',strokeWeight:1.5,scale:1,labelOrigin:new google.maps.Point(0,0)}
    });
    mk.addListener('click',()=>openDetail(p));
    markers.push(mk);
  });
}

function bootMap(){
  if(!S.gkey){ document.getElementById('map').classList.add('hidden');
               document.getElementById('nomap').classList.add('show'); return; }
  const sc=document.createElement('script');
  sc.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(S.gkey)}&libraries=places&language=${S.lang||'it'}&callback=initMap`;
  sc.onerror=()=>{ toast(t('tKeyBad')); document.getElementById('nomap').classList.add('show'); };
  document.head.appendChild(sc);
}
window.initMap=function(){
  document.getElementById('map').classList.remove('hidden');
  document.getElementById('nomap').classList.remove('show');
  map=new google.maps.Map(document.getElementById('map'),{
    center:me,zoom:8,disableDefaultUI:true,zoomControl:true,gestureHandling:'greedy',
    styles:[
      {elementType:'geometry',stylers:[{color:'#16262F'}]},
      {elementType:'labels.text.fill',stylers:[{color:'#7D97A5'}]},
      {elementType:'labels.text.stroke',stylers:[{color:'#0E1A22'}]},
      {featureType:'water',elementType:'geometry',stylers:[{color:'#0B1A22'}]},
      {featureType:'road',elementType:'geometry',stylers:[{color:'#23404F'}]},
      {featureType:'road.highway',elementType:'geometry',stylers:[{color:'#2E5266'}]},
      {featureType:'poi',stylers:[{visibility:'off'}]},
      {featureType:'transit',stylers:[{visibility:'off'}]}
    ]
  });
  traffic=new google.maps.TrafficLayer(); traffic.setMap(S.traffic!==false?map:null);
  dirRenderer=new google.maps.DirectionsRenderer({map,suppressMarkers:true,
    polylineOptions:{strokeColor:'#F2A93B',strokeWeight:5,strokeOpacity:.9}});
  try{ placesSvc=new google.maps.places.PlacesService(map); }catch(e){ placesSvc=null; }
  try{ new google.maps.places.Autocomplete(document.getElementById('dest')); }catch(e){}
  renderVias();          // ricreo le righe ora che il completamento è disponibile
  meMarker=new google.maps.Marker({map,position:me,zIndex:99,
    icon:{path:google.maps.SymbolPath.CIRCLE,scale:7,fillColor:'#DCE8EE',
          fillOpacity:1,strokeColor:'#0E1A22',strokeWeight:3}});
  watchMe(); render();
};
function watchMe(){
  if(!navigator.geolocation) return;
  navigator.geolocation.watchPosition(p=>{
    me={lat:p.coords.latitude,lng:p.coords.longitude};
    if(meMarker) meMarker.setPosition(me);
    render();
  },()=>{},{enableHighAccuracy:true,maximumAge:15000,timeout:20000});
}

/* costruisce distanza, tempo e flag autostradale dai singoli passi */
function profileOf(routeObj){
  const pts=[],km=[0],sec=[0],isH=[];
  for(const leg of routeObj.legs){
    const base=leg.duration?.value||0;
    const real=leg.duration_in_traffic?.value||base;
    const k=base>0?real/base:1;
    for(const step of leg.steps){
      const path=step.path||step.lat_lngs||[];
      if(path.length<2) continue;
      const txt=(step.instructions||'')+' '+(step.summary||'');
      const h=HWY_RE.test(txt.replace(/<[^>]+>/g,' '));
      const sSec=(step.duration?.value||0)*k;
      let sKm=0; const seg=[];
      for(let i=1;i<path.length;i++){
        const a={lat:path[i-1].lat(),lng:path[i-1].lng()};
        const b={lat:path[i].lat(),lng:path[i].lng()};
        const d=hav(a,b); sKm+=d; seg.push({p:b,d});
      }
      if(!pts.length){ pts.push({lat:path[0].lat(),lng:path[0].lng()}); isH.push(h); }
      for(const {p,d} of seg){
        pts.push(p); km.push(km[km.length-1]+d);
        sec.push(sec[sec.length-1]+(sKm>0?sSec*(d/sKm):0)); isH.push(h);
      }
    }
  }
  return {pts,km,sec,isH};
}

async function trace(){
  const dest=document.getElementById('dest').value.trim();
  if(!dest) return toast(t('tNoDest'));
  if(!map) return toast(t('tNoKey'));
  S.lastDest=dest; save();
  const way=S.via.map(v=>({location:v.lat!=null?{lat:v.lat,lng:v.lng}:v.name, stopover:true}));
  const req={ origin:me,destination:dest,travelMode:'DRIVING',
    waypoints:way,
    avoidHighways:!!S.noHwy, avoidFerries:!!S.noFerry,
    avoidTolls: S.profile==='cheap' ? true : !!S.noToll,
    provideRouteAlternatives: way.length===0,   // Google non dà alternative con le tappe
    drivingOptions:{departureTime:new Date(),trafficModel:'bestguess'} };

  toast(t('tCalc'));
  new google.maps.DirectionsService().route(req,async (res,st)=>{
    if(st!=='OK') return toast(t('tNotFound')+' '+st);

    altRes=res; altProfs=res.routes.map(profileOf); altCache={}; altIdx=0;
    dirRenderer.setDirections(res);

    // nel profilo panoramico scelgo io la rotta con più cose da vedere
    if(S.profile==='scenic'&&placesSvc){
      toast(t('tCompare'));
      const best=Math.min(...altProfs.map(p=>p.sec[p.sec.length-1]));
      let top=-1;
      for(let i=0;i<altProfs.length;i++){
        const p=altProfs[i];
        if(p.sec[p.sec.length-1]>best*1.3) continue;
        const found=await fetchPOIs(p.pts,p.km,true);
        const sc=found.reduce((a,x)=>a+x.rating*Math.log10(1+x.rev),0);
        if(sc>top){ top=sc; altIdx=i; }
      }
    }

    renderRoutes();
    await selectRoute(altIdx);
    const nuovi=unconfigured().length;
    toast(`${altProfs.length>1?altProfs.length+' '+t('tRoutes')+' · ':''}`+
          `${Math.round(summary.km)} km · ${fmtDur(summary.sec)}`+
          (nuovi?` · ${nuovi} ${t('tNewOps')}`:''));
  });
}

async function selectRoute(i){
  if(!altRes||!altProfs[i]) return;
  altIdx=i;
  renderRoutes();                    // evidenzia subito, prima delle ricerche
  dirRenderer.setRouteIndex(i);
  const p=altProfs[i];
  route=p.pts; cum=p.km; cumT=p.sec; hwy=p.isH;
  summary={km:cum[cum.length-1],sec:cumT[cumT.length-1]};

  if(altCache[i]){ stations=altCache[i].st; pois=altCache[i].po; usingDemo=altCache[i].demo; render(); }
  else{
    render();                       // mostro subito la nuova rotta con i dati vecchi
    toast(t('tSeek'));
    await fetchOCM();
    pois = (S.profile==='scenic'&&placesSvc) ? await fetchPOIs(p.pts,p.km,false) : [];
    altCache[i]={st:stations,po:pois,demo:usingDemo};
    render();
    toast(`${filterAhead().length} ${t('chargers')}${usingDemo?' (demo)':''}`);
  }
}

function renderRoutes(){
  const box=document.getElementById('routes'), row=document.getElementById('routesRow');
  const n=altProfs.length;
  box.classList.toggle('on', n>1 || S.via.length>0);
  if(n<2){
    document.getElementById('routesRow').innerHTML=
      S.via.length?`<span class="hint" style="padding:2px 2px 6px">${t('viaNote')}</span>`:'';
    return;
  }
  const best=Math.min(...altProfs.map(p=>p.sec[p.sec.length-1]));
  row.innerHTML='';
  altProfs.forEach((p,i)=>{
    const sec=p.sec[p.sec.length-1], km=p.km[p.km.length-1];
    const diff=Math.round((sec-best)/60);
    const via=(altRes.routes[i].summary||'').slice(0,22)||String.fromCharCode(65+i);
    const b=document.createElement('button');
    b.className='rt'+(i===altIdx?' on':''); b.dataset.rt=i;
    b.innerHTML=`<span class="lb">${via}</span>`+
      `<span class="big">${fmtDur(sec)}</span>`+
      `<span class="sm">${Math.round(km)} km${diff>0?` · +${diff} ${t('min')}`:' · '+t('pfFastS')}</span>`;
    row.appendChild(b);
  });
}
document.getElementById('routesRow').addEventListener('click',e=>{
  const b=e.target.closest('[data-rt]'); if(!b) return;
  selectRoute(+b.dataset.rt);
});

function unconfigured(){
  const m=new Map();
  filterAhead().forEach(s=>{
    if(opFor(s.operator)) return;
    const n=(s.operator||'').trim();
    if(!n||n==='—') return;
    m.set(n,(m.get(n)||0)+1);
  });
  return [...m.entries()].sort((a,b)=>b[1]-a[1]);
}

function fillLangs(){
  const sel=document.getElementById('lang');
  if(sel.options.length) return;
  Object.entries(LANGS).forEach(([k,v])=>{
    const o=document.createElement('option'); o.value=k; o.textContent=v; sel.appendChild(o);
  });
}
function fillCars(){
  const sel=document.getElementById('car');
  if(sel.options.length) return;
  CARS.forEach(c=>{ const o=document.createElement('option');
    o.value=c.nm; o.textContent=`${c.nm} — ${c.kwh} kWh · ${c.wh} Wh/km`; sel.appendChild(o); });
  const o=document.createElement('option'); o.value='__custom'; o.textContent='Personalizzata'; sel.appendChild(o);
  sel.addEventListener('change',()=>{
    const c=CARS.find(x=>x.nm===sel.value);
    if(c){ document.getElementById('kwh').value=c.kwh; document.getElementById('wh').value=c.wh; }
  });
}
function paintSettings(){
  fillLangs(); fillCars();
  document.getElementById('lang').value=S.lang||'it';
  const v=(id,val)=>document.getElementById(id).value=val;
  const c=(id,val)=>document.getElementById(id).checked=!!val;
  v('gkey',S.gkey||''); v('ockey',S.ockey||'');
  v('kwh',S.kwh); v('wh',S.wh); v('reserve',S.reserve); v('refv',S.refv); v('avgkw',S.avgkw);
  v('car',CARS.some(c=>c.nm===S.car)?S.car:'__custom');
  v('eff',S.eff); v('corr',S.corridor); v('minkw',S.minkw);
  v('minrate',S.minrate); v('minrev',S.minrev); v('cmode',S.cmode);
  c('noHwy',S.noHwy); c('noFerry',S.noFerry); c('noToll',S.noToll); c('onlyMine',S.onlyMine); c('awake',S.awake); c('traffic',S.traffic!==false);

  const ops=document.getElementById('ops'); ops.innerHTML='';
  S.ops.forEach((o,i)=>{
    const d=document.createElement('div'); d.className='op-row';
    d.innerHTML=`<input type="color" value="${o.color}" data-i="${i}" data-f="color" aria-label="Colore ${o.nm}">
      <input type="checkbox" ${o.use!==false?'checked':''} data-i="${i}" data-f="use" aria-label="Usa ${o.nm}">
      <span class="nm ${o.use===false?'off':''}">${o.nm}</span>
      <input type="number" step="0.01" value="${o.price}" data-i="${i}" data-f="price" aria-label="Euro al kWh ${o.nm}">
      <input type="number" step="0.10" value="${o.fee||0}" data-i="${i}" data-f="fee" aria-label="Fee ${o.nm}">
      <button class="del" data-del="${i}" aria-label="Rimuovi ${o.nm}">×</button>`;
    ops.appendChild(d);
  });

  const cbox=document.getElementById('cats'); cbox.innerHTML='';
  CATS.forEach(c=>{
    const b=document.createElement('button');
    b.className='chip'+(S.cats.includes(c.id)?' on':'');
    b.dataset.cat=c.id;
    b.innerHTML=`<span class="plus">${S.cats.includes(c.id)?'✓':'+'}</span><b>${t('cat_'+c.id)}</b>`;
    cbox.appendChild(b);
  });
  document.getElementById('exclude').value=S.exclude||'';

  const found=document.getElementById('found'); found.innerHTML='';
  const list=unconfigured();
  if(!list.length){
    found.innerHTML=`<p class="hint" style="margin:0">${t('foundNone')}</p>`;
  } else list.slice(0,24).forEach(([nm,n])=>{
    const b=document.createElement('button'); b.className='chip'; b.dataset.add=nm;
    b.innerHTML=`<span class="plus">+</span><b>${nm.slice(0,26)}</b><span class="n">${n}</span>`;
    found.appendChild(b);
  });
}
document.getElementById('ops').addEventListener('input',e=>{
  const t=e.target; if(!t.dataset.f) return;
  const o=S.ops[+t.dataset.i];
  if(t.dataset.f==='use'){
    o.use=t.checked;
    t.parentElement.querySelector('.nm').classList.toggle('off',!t.checked);
  } else if(t.dataset.f==='color'){ o.color=t.value; }
  else { o[t.dataset.f]=+t.value||0; }
});
document.getElementById('ops').addEventListener('click',e=>{

document.getElementById('newOp').addEventListener('keydown',e=>{

document.getElementById('gear').onclick=()=>{ paintSettings(); document.getElementById('settings').classList.add('show'); };
document.getElementById('saveSet').onclick=async()=>{
  const g=id=>document.getElementById(id);
  const prev=S.gkey, prevRoute=JSON.stringify([S.noHwy,S.noFerry,S.noToll]);
  const prevLang=S.lang; S.lang=g('lang').value;
  S.gkey=g('gkey').value.trim(); S.ockey=g('ockey').value.trim();
  S.kwh=+g('kwh').value||78; S.wh=+g('wh').value||185;
  S.reserve=Math.min(40,Math.max(0,+g('reserve').value||0));
  S.avgkw=+g('avgkw').value||110; S.refv=+g('refv').value||110;
  S.car=g('car').value; S.eff=+g('eff').value||0.92;
  S.corridor=+g('corr').value||6; S.minkw=+g('minkw').value||50;
  S.minrate=+g('minrate').value||4.3; S.minrev=+g('minrev').value||0;
  S.exclude=g('exclude').value;
  S.cmode=g('cmode').value; S.onlyMine=g('onlyMine').checked;
  S.awake=g('awake').checked; applyWake();
  S.traffic=g('traffic').checked; if(traffic) traffic.setMap(S.traffic?map:null);
  S.noHwy=g('noHwy').checked; S.noFerry=g('noFerry').checked; S.noToll=g('noToll').checked;
  await save();
  if(S.lang!==prevLang){ location.reload(); return; }   // la mappa va ricaricata nella nuova lingua
  document.getElementById('settings').classList.remove('show');
  if(S.gkey&&S.gkey!==prev&&!map) bootMap(); else render();
  const cambiato=JSON.stringify([S.noHwy,S.noFerry,S.noToll])!==prevRoute;
  toast(cambiato&&route.length?t('tRecalc'):t('tSaved'));
};

}
socEl.oninput=()=>{ paintSoc(); render(); if(selected&&!selected.poi) openDetail(selected); };

(async()=>{
  document.getElementById('ver').textContent='v'+APP_VERSION;
  document.getElementById('verSet').textContent=`${t('version')} ${APP_VERSION} ${t('ofDate')} ${APP_DATE}.`;

  stations=DEMO.slice(); bootMap(); renderStops(); renderVias(); renderRoutes(); applyWake(); render();
  if(!S.gkey) toast(t('tKeyAsk'));
